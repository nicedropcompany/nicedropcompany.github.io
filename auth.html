<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Acesso ao Sistema</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Estilo específico para integrar o formulário ao fundo de céu */
        body.auth-page {
            background: url('sky.png') no-repeat center center fixed !important;
            background-size: cover !important;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Container Central Glassmorphism */
        .auth-glass-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            z-index: 10;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.35) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 25px !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05) !important;
            overflow: hidden;
            color: #1a3a5c;
        }

        .auth-header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        .auth-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: #1a3a5c;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Inputs Minimalistas */
        .minimal-input {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.5);
            font-family: 'DM Sans', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .minimal-input:focus {
            border-color: #00d4ff;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
        }

        /* Tabs de Vidro */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: rgba(26, 58, 92, 0.5);
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: #1a3a5c;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid #00d4ff;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-glass-container">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html">
                <img src="/nicedrop.png" alt="NiceDrop" style="height: 45px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));">
            </a>
        </div>

        <div class="auth-card" data-aos="zoom-in">
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">ENTRAR</button>
                <button class="tab-btn" data-tab="signup">REGISTAR</button>
            </div>

            <form id="loginForm" class="auth-form active" data-form="login" style="padding: 40px; display: block;">
                <div class="auth-header">
                    <h2>BEM-VINDO</h2>
                    <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 25px;">Aceda ao sistema de logística</p>
                </div>

                <input type="email" id="loginEmail" placeholder="Email" required class="minimal-input">
                <input type="password" id="loginPassword" placeholder="Password" required class="minimal-input">

                <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; border-radius: 12px; margin-top: 10px; font-weight: 700;">
                    ENTRAR NO SISTEMA
                </button>
            </form>

            <form id="signupForm" class="auth-form" data-form="signup" style="padding: 40px; display: none;">
                <div class="auth-header">
                    <h2>CRIAR CONTA</h2>
                    <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 25px;">Junte-se à frota NiceDrop</p>
                </div>

                <input type="text" id="signupName" placeholder="Nome Completo" required class="minimal-input">
                <input type="email" id="signupEmail" placeholder="Email" required class="minimal-input">
                <input type="password" id="signupPassword" placeholder="Password" required class="minimal-input">
                <input type="password" id="signupConfirm" placeholder="Confirmar Password" required class="minimal-input">

                <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; border-radius: 12px; margin-top: 10px; font-weight: 700;">
                    REGISTAR CONTA
                </button>
            </form>

            <div id="authMessage" class="auth-message" style="display: none; padding: 15px; text-align: center; font-family: 'DM Sans'; font-size: 0.85rem; border-radius: 0 0 25px 25px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth-supabase.js"></script>
    
    <script>
        // Lógica de UI para troca de abas
        document.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('.tab-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.querySelectorAll('.auth-form').forEach(f => {
                        f.style.display = f.dataset.form === tab ? 'block' : 'none';
                    });
                });
            });
        });
    </script>

</body>
</html>
