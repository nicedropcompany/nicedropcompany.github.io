<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Sign In / Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-page">

    <a class="skip-link" href="#main">Saltar para o conteúdo</a>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/index.html" class="logo-wrap">
            <img src="/nicedrop.png" class="logo" alt="NiceDrop logo">
        </a>

        <nav class="nav-links" aria-label="Primário">
            <a href="/index.html">Início</a>
            <a href="/download.html">App</a>
        </nav>

        <div class="navbar-actions">
            <button id="themeToggle" class="theme-btn" aria-label="Alternar tema">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- AUTH SPLIT LAYOUT -->
    <main id="main" class="auth-container">

        <!-- BRAND SIDE -->
        <div class="auth-brand">
            <img src="/nicedrop.png" class="auth-brand-logo" alt="NiceDrop">

            <div class="auth-brand-drone">
                <img src="/drone.svg" alt="NiceDrop drone">
            </div>

            <p class="auth-brand-tagline">ENTREGAS EM 12 MINUTOS.<br>EM QUALQUER PONTO DA CIDADE.</p>

            <div class="auth-brand-stat">
                <span class="mono">38</span> NODES ATIVOS
            </div>

            <div class="auth-brand-live">
                <span class="auth-brand-live-dot"></span>
                SISTEMA OPERACIONAL
            </div>
        </div>

        <!-- FORM SIDE -->
        <div class="auth-form-side">
            <div class="auth-card">

                <!-- TABS -->
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Entrar</button>
                    <button class="tab-btn" data-tab="signup">Registar</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="auth-form active" data-form="login">
                    <h2>Bem-vindo</h2>
                    <p class="form-subtitle">Aceda à sua conta</p>

                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="seu@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn-submit">Entrar</button>

                    <p class="form-toggle">
                        Não tem uma conta?
                        <button type="button" class="toggle-btn" data-tab="signup">
                            Registar
                        </button>
                    </p>
                </form>

                <!-- SIGNUP FORM -->
                <form id="signupForm" class="auth-form" data-form="signup">
                    <h2>Criar Conta</h2>
                    <p class="form-subtitle">Junte-se à rede NiceDrop</p>

                    <div class="form-group">
                        <label for="signupName">Nome Completo</label>
                        <input
                            type="text"
                            id="signupName"
                            name="name"
                            placeholder="Seu nome"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="seu@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupConfirm">Confirmar Password</label>
                        <input
                            type="password"
                            id="signupConfirm"
                            name="confirmPassword"
                            placeholder="••••••••"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <button type="submit" class="btn-submit">Criar Conta</button>

                    <p class="form-toggle">
                        Já tem uma conta?
                        <button type="button" class="toggle-btn" data-tab="login">
                            Entrar
                        </button>
                    </p>
                </form>

                <!-- MESSAGE AREA -->
                <div id="authMessage" class="auth-message" style="display: none;"></div>

            </div>
        </div>

    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth-supabase.js"></script>
    <script>
        // Theme toggle
        (function(){
            const saved = localStorage.getItem('nd-theme');
            if(saved === 'light') document.documentElement.setAttribute('data-theme','light');
        })();
        document.addEventListener('DOMContentLoaded', function(){
            const btn = document.getElementById('themeToggle');
            if(!btn) return;
            btn.addEventListener('click', function(){
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
                localStorage.setItem('nd-theme', isLight ? 'dark' : 'light');
            });
            // Tab switching
            document.querySelectorAll('.tab-btn, .toggle-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    const tab = this.dataset.tab;
                    if(!tab) return;
                    document.querySelectorAll('.tab-btn').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === tab); });
                    document.querySelectorAll('.auth-form').forEach(function(f){ f.classList.toggle('active', f.dataset.form === tab); });
                });
            });
        });
    </script>

</body>

</html>
