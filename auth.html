<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Acesso ao Sistema</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Fundo fixo e sem scroll no body */
        body.auth-page {
            background: url('sky.png') no-repeat center center fixed !important;
            background-size: cover !important;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Permite que o body cresça se necessário */
            margin: 0;
            padding: 20px; /* Margem de segurança para mobile */
            box-sizing: border-box;
        }

        .auth-glass-container {
            width: 100%;
            max-width: 420px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            max-height: 90vh; /* O contentor nunca ocupa mais de 90% da altura do ecrã */
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-radius: 0 !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.03) !important;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #000;
        }

        /* O segredo do scroll está aqui: */
        .auth-form-scroll {
            overflow-y: auto; /* Ativa scroll vertical apenas aqui dentro */
            padding: 40px;
            scrollbar-width: thin; /* Scrollbar discreta em Firefox */
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }

        /* Scrollbar discreta para Chrome/Safari */
        .auth-form-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .auth-form-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        /* Removido o azul das tabs */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0; /* Impede que as abas encolham */
        }

        .tab-btn {
            flex: 1;
            padding: 20px;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: 0.4s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #fff;
            background: #000;
        }

        .minimal-input {
            width: 100%;
            padding: 18px 22px;
            margin-bottom: 15px;
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.4);
            font-family: 'DM Sans', sans-serif;
            box-sizing: border-box;
            outline: none;
            color: #000;
        }

        .auth-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            line-height: 1;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-glass-container">
        
        <div style="text-align: center; margin-bottom: 30px; flex-shrink: 0;">
            <a href="index.html">
                <img src="/nicedrop.png" alt="NiceDrop" style="height: 40px; opacity: 0.9;">
            </a>
        </div>

        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">ENTRAR</button>
                <button class="tab-btn" data-tab="signup">REGISTAR</button>
            </div>

            <div id="loginFormContainer" class="auth-form active auth-form-scroll" data-form="login" style="display: block;">
                <form id="loginForm">
                    <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
                        <h2>SISTEMA</h2>
                        <p style="font-size: 0.85rem; opacity: 0.6;">Autenticação de infraestrutura</p>
                    </div>

                    <input type="email" id="loginEmail" placeholder="Email institucional" required class="minimal-input">
                    <input type="password" id="loginPassword" placeholder="Password" required class="minimal-input">

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; margin-top: 10px; font-weight: 700;">
                        CONECTAR
                    </button>

                    <div style="display:flex;align-items:center;gap:12px;margin:18px 0 14px;">
                        <div style="flex:1;height:1px;background:rgba(0,0,0,0.15);"></div>
                        <span style="font-family:'DM Sans',sans-serif;font-size:0.72rem;color:rgba(0,0,0,0.4);letter-spacing:1px;text-transform:uppercase;">ou</span>
                        <div style="flex:1;height:1px;background:rgba(0,0,0,0.15);"></div>
                    </div>

                    <button type="button" onclick="handleGoogleAuth()" style="width:100%;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.15);font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><g><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.092 17.64 11.784 17.64 9.2z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></g></svg>
                        CONTINUAR COM GOOGLE
                    </button>

                    <a href="recovery.html" style="display: block; text-align: center; margin-top: 14px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: rgba(0,0,0,0.5); text-decoration: none; letter-spacing: 1px; text-transform: uppercase;">
                        Esqueceste a password?
                    </a>
                </form>
            </div>

            <div id="signupFormContainer" class="auth-form auth-form-scroll" data-form="signup" style="display: none;">
                <form id="signupForm">
                    <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
                        <h2>REGISTO</h2>
                        <p style="font-size: 0.85rem; opacity: 0.6;">Criar novo acesso à rede</p>
                    </div>

                    <input type="text" id="signupName" placeholder="Nome Completo" required class="minimal-input">
                    <input type="email" id="signupEmail" placeholder="Email" required class="minimal-input">
                    <input type="password" id="signupPassword" placeholder="Password" required class="minimal-input">
                    <input type="password" id="signupConfirm" placeholder="Confirmar Password" required class="minimal-input">

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; margin-top: 10px; font-weight: 700;">
                        REGISTAR
                    </button>

                    <div style="display:flex;align-items:center;gap:12px;margin:18px 0 14px;">
                        <div style="flex:1;height:1px;background:rgba(0,0,0,0.15);"></div>
                        <span style="font-family:'DM Sans',sans-serif;font-size:0.72rem;color:rgba(0,0,0,0.4);letter-spacing:1px;text-transform:uppercase;">ou</span>
                        <div style="flex:1;height:1px;background:rgba(0,0,0,0.15);"></div>
                    </div>

                    <button type="button" onclick="handleGoogleAuth()" style="width:100%;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.15);font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;">
                        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><g><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.092 17.64 11.784 17.64 9.2z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></g></svg>
                        REGISTAR COM GOOGLE
                    </button>
                </form>
            </div>

            <div id="authMessage" class="auth-message" style="display: none; padding: 20px; text-align: center; font-family: 'DM Sans'; font-size: 0.8rem; background: rgba(255,255,255,0.2);"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/app.js"></script>
    <script src="/auth-supabase.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            function switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');
                document.querySelectorAll('.auth-form').forEach(f => {
                    f.style.display = f.dataset.form === tab ? 'block' : 'none';
                });
            }

            document.querySelectorAll('.tab-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    switchTab(this.dataset.tab);
                });
            });

            // Abrir tab correto via ?tab=signup
            const params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'signup') switchTab('signup');
        });
    </script>
</body>
</html>
