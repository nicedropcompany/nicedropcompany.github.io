<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Acesso ao Sistema</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Bloqueio total de scroll e ajuste de fundo */
        body.auth-page {
            background: url('sky.png') no-repeat center center fixed !important;
            background-size: cover !important;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Ocupa exatamente a altura do ecrã */
            margin: 0;
            overflow: hidden; /* Remove o scroll */
        }

        .auth-glass-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-radius: 30px !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.03) !important;
            overflow: hidden;
            color: #1a3a5c;
        }

        /* Tabs sem o sublinhado azul */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 20px;
            border: none;
            background: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: rgba(26, 58, 92, 0.4);
            cursor: pointer;
            transition: 0.4s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #1a3a5c;
            background: rgba(255, 255, 255, 0.3); /* Destaque apenas por brilho, sem barra azul */
        }

        .minimal-input {
            width: 100%;
            padding: 18px 22px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.4);
            font-family: 'DM Sans', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s ease;
            color: #1a3a5c;
        }

        .minimal-input::placeholder {
            color: rgba(26, 58, 92, 0.4);
        }

        .minimal-input:focus {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .auth-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            color: #1a3a5c;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-glass-container">
        
        <div style="text-align: center; margin-bottom: 40px;">
            <a href="index.html">
                <img src="/nicedrop.png" alt="NiceDrop" style="height: 42px; opacity: 0.9;">
            </a>
        </div>

        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">ENTRAR</button>
                <button class="tab-btn" data-tab="signup">REGISTAR</button>
            </div>

            <form id="loginForm" class="auth-form active" data-form="login" style="padding: 45px; display: block;">
                <div class="auth-header" style="text-align: center; margin-bottom: 35px;">
                    <h2>SISTEMA</h2>
                    <p style="font-size: 0.85rem; opacity: 0.6; font-family: 'DM Sans'; font-weight: 500;">Autenticação de infraestrutura</p>
                </div>

                <input type="email" id="loginEmail" placeholder="Email institucional" required class="minimal-input">
                <input type="password" id="loginPassword" placeholder="Password" required class="minimal-input">

                <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; border-radius: 15px; margin-top: 15px; font-weight: 700; letter-spacing: 1px;">
                    CONECTAR
                </button>
            </form>

            <form id="signupForm" class="auth-form" data-form="signup" style="padding: 45px; display: none;">
                <div class="auth-header" style="text-align: center; margin-bottom: 35px;">
                    <h2>REGISTO</h2>
                    <p style="font-size: 0.85rem; opacity: 0.6; font-family: 'DM Sans'; font-weight: 500;">Criar novo acesso à rede</p>
                </div>

                <input type="text" id="signupName" placeholder="Nome Completo" required class="minimal-input">
                <input type="email" id="signupEmail" placeholder="Email" required class="minimal-input">
                <input type="password" id="signupPassword" placeholder="Password" required class="minimal-input">
                <input type="password" id="signupConfirm" placeholder="Confirmar Password" required class="minimal-input">

                <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; border-radius: 15px; margin-top: 15px; font-weight: 700; letter-spacing: 1px;">
                    REGISTAR
                </button>
            </form>

            <div id="authMessage" class="auth-message" style="display: none; padding: 20px; text-align: center; font-family: 'DM Sans'; font-size: 0.8rem; background: rgba(255,255,255,0.2);"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth-supabase.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('.tab-btn').forEach(function(btn){
                btn.addEventListener('click', function(){
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.querySelectorAll('.auth-form').forEach(f => {
                        f.style.display = f.dataset.form === tab ? 'block' : 'none';
                    });
                });
            });
        });
    </script>
</body>
</html>
