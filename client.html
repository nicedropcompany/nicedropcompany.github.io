<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Perfil</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <style>
        .profile-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            overflow-x: auto;
            scrollbar-width: none;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }
        .profile-tabs::-webkit-scrollbar { display: none; }

        .profile-tab-btn {
            padding: 14px 22px;
            font-size: 0.7rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            color: var(--ink-faint);
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s;
        }
        .profile-tab-btn.active {
            color: var(--ink);
            border-bottom-color: var(--ink);
        }
        .profile-tab-btn:hover { color: var(--ink); }

        .profile-tab-panel { display: none; }
        .profile-tab-panel.active { display: flex; flex-direction: column; gap: 20px; }

        .profile-hero {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px 32px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: var(--shadow);
        }

        .profile-avatar-large {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', 'BebasNeue', sans-serif;
            font-size: 2.2rem;
            flex-shrink: 0;
        }

        .profile-name {
            font-family: 'Bebas Neue', 'BebasNeue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .profile-email { font-size: 0.82rem; color: var(--ink-faint); margin-top: 4px; }

        .profile-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .profile-since {
            font-size: 0.68rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .data-row:last-child { border-bottom: none; }
        .data-row-left { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .data-row-title { font-weight: 600; font-size: 0.85rem; }
        .data-row-sub { font-size: 0.74rem; color: var(--ink-faint); }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .product-card {
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--glass-border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .product-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            background: rgba(0,0,0,0.04);
        }
        .product-name { font-weight: 600; font-size: 0.82rem; }
        .product-price { font-family: 'Bebas Neue', 'BebasNeue', sans-serif; font-size: 1.05rem; }
        .product-cat { font-size: 0.68rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }

        .empty-section {
            text-align: center;
            padding: 38px 20px;
            color: var(--ink-faint);
            font-size: 0.8rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .loja-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .loja-store-section + .loja-store-section {
            border-top: 2px solid var(--glass-border);
            padding-top: 28px;
            margin-top: 8px;
        }
        @media (max-width: 640px) {
            .profile-hero { flex-direction: column; text-align: center; align-items: center; padding: 22px; }
            .profile-meta { justify-content: center; }
            .loja-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

    <nav class="topbar">
        <a href="index.html"><img src="nicedrop.png" class="brand-logo" alt="NiceDrop"></a>
        <div class="topbar-right" style="gap:12px;">
            <span id="userName" class="user-name">---</span>
            <a id="panelBtn" href="#" class="btn-outline" style="display:none;">Painel</a>
            <button id="logoutBtn" class="btn-primary">Sair</button>
        </div>
    </nav>

    <div class="main" style="padding-top:100px;">

        <!-- Perfil hero -->
        <div class="profile-hero">
            <div id="profileAvatar" class="profile-avatar-large">U</div>
            <div style="flex:1;min-width:0;">
                <div id="profileName" class="profile-name">---</div>
                <div id="profileEmail" class="profile-email">---</div>
                <div class="profile-meta">
                    <span id="profileRoleBadge" class="badge">---</span>
                    <span id="profileSince" class="profile-since"></span>
                </div>
            </div>
            <button id="editProfileBtn" class="btn-outline" style="font-size:0.7rem;padding:10px 18px;flex-shrink:0;">Editar</button>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs" id="profileTabs">
            <button class="profile-tab-btn active" data-tab="resumo">Resumo</button>
            <button class="profile-tab-btn" data-tab="encomendas">Encomendas</button>
            <button class="profile-tab-btn" data-tab="carrinho">Carrinho</button>
            <button class="profile-tab-btn" data-tab="moradas">Moradas</button>
            <button class="profile-tab-btn" data-tab="favoritos">Favoritos</button>
            <button class="profile-tab-btn" id="lojaTabBtn" data-tab="loja" style="display:none;">Loja</button>
        </div>

        <!-- TAB: Resumo -->
        <div class="profile-tab-panel active" id="tab-resumo">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">Encomendas</div>
                    <div class="stat-number" id="statOrders">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Gasto</div>
                    <div class="stat-number" id="statSpent" style="font-size:1.5rem;padding-top:4px;">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Lojas Diferentes</div>
                    <div class="stat-number" id="statStores">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Moradas Guardadas</div>
                    <div class="stat-number" id="statAddresses">—</div>
                </div>
            </div>
            <div class="card glass-card">
                <div class="card-header">
                    <h2 class="card-title" style="font-size:1.15rem;">Últimas Encomendas</h2>
                    <button class="btn-outline" style="font-size:0.68rem;padding:8px 14px;" onclick="switchTab('encomendas')">Ver todas</button>
                </div>
                <div id="recentOrdersList"></div>
            </div>
        </div>

        <!-- TAB: Encomendas -->
        <div class="profile-tab-panel" id="tab-encomendas">
            <div class="card glass-card">
                <div class="card-header">
                    <h2 class="card-title" style="font-size:1.15rem;">Todas as Encomendas</h2>
                    <span id="ordersTotal" class="badge"></span>
                </div>
                <div class="table-vertical-scroll" style="max-height:520px;">
                    <table class="glass-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Loja</th>
                                <th>Valor</th>
                                <th>Estado</th>
                                <th>Morada</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB: Carrinho -->
        <div class="profile-tab-panel" id="tab-carrinho">
            <div class="card glass-card">
                <div class="card-header">
                    <h2 class="card-title" style="font-size:1.15rem;">Carrinho Atual</h2>
                    <span id="cartTotal" class="badge"></span>
                </div>
                <div id="cartList"></div>
            </div>
        </div>

        <!-- TAB: Moradas -->
        <div class="profile-tab-panel" id="tab-moradas">
            <div class="card glass-card">
                <div class="card-header">
                    <h2 class="card-title" style="font-size:1.15rem;">Moradas Guardadas</h2>
                    <span id="addressesCount" class="badge"></span>
                </div>
                <div id="addressesList"></div>
            </div>
        </div>

        <!-- TAB: Favoritos -->
        <div class="profile-tab-panel" id="tab-favoritos">
            <div class="card glass-card">
                <div class="card-header">
                    <h2 class="card-title" style="font-size:1.15rem;">Produtos Favoritos</h2>
                    <span id="favoritesCount" class="badge"></span>
                </div>
                <div id="favoritesList"></div>
            </div>
        </div>

        <!-- TAB: Loja (operator / owner) -->
        <div class="profile-tab-panel" id="tab-loja"></div>

    </div>

    <!-- Modal Editar Perfil -->
    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="editProfileModal" class="modal glass-panel">
        <div class="modal-header">
            <h2 style="font-size:1.4rem;margin:0;">Editar Perfil</h2>
            <button class="modal-close" onclick="closeModal('editProfileModal')">&times;</button>
        </div>
        <form id="editProfileForm" style="display:flex;flex-direction:column;gap:14px;">
            <input type="text" id="editUsername" placeholder="Nome de utilizador" required>
            <div id="editError" style="display:none;color:#e74c3c;font-size:0.82rem;"></div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn-primary" style="flex:1;">GUARDAR</button>
                <button type="button" class="btn-outline" onclick="closeModal('editProfileModal')" style="flex:1;">CANCELAR</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="app.js"></script>
    <script src="client.js"></script>
</body>
</html>
