<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Perfil</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <style>
        .profile-hero {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: var(--shadow);
        }

        .profile-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', 'BebasNeue', sans-serif;
            font-size: 2.4rem;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-name {
            font-family: 'Bebas Neue', 'BebasNeue', sans-serif;
            font-size: 2rem;
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .profile-email {
            font-size: 0.85rem;
            color: var(--ink-faint);
            letter-spacing: 0.5px;
        }

        .profile-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .profile-since {
            font-size: 0.72rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .order-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }

        .order-row:last-child {
            border-bottom: none;
        }

        .order-id {
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            color: var(--ink-soft);
        }

        .order-store {
            color: var(--ink-faint);
            font-size: 0.78rem;
        }

        .order-date {
            font-size: 0.72rem;
            color: var(--ink-faint);
            letter-spacing: 0.5px;
        }

        .empty-orders {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-faint);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-dash-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--ink-faint);
            transition: color 0.2s;
        }

        .nav-dash-link:hover {
            color: var(--ink);
        }

        @media (max-width: 600px) {
            .profile-hero {
                flex-direction: column;
                text-align: center;
                align-items: center;
            }
            .profile-actions {
                align-items: center;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .profile-meta {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <nav class="topbar">
        <a href="index.html"><img src="nicedrop.png" class="brand-logo" alt="NiceDrop"></a>
        <div class="topbar-right">
            <span id="userName" class="user-name">---</span>
            <span id="userRole" class="user-role" style="margin-right:8px;"></span>
            <button id="logoutBtn" class="btn-primary">Sair</button>
        </div>
    </nav>

    <div class="main" style="padding-top:100px;">

        <div id="dashLink" style="display:none; margin-bottom:4px;">
            <a id="dashAnchor" class="nav-dash-link" href="#">&#8592; Painel</a>
        </div>

        <!-- Perfil hero card -->
        <div class="profile-hero" data-aos="fade-up">
            <div id="profileAvatar" class="profile-avatar-large">U</div>
            <div class="profile-info">
                <div id="profileName" class="profile-name">---</div>
                <div id="profileEmail" class="profile-email">---</div>
                <div class="profile-meta">
                    <span id="profileRoleBadge" class="badge">---</span>
                    <span id="profileSince" class="profile-since"></span>
                </div>
            </div>
            <div class="profile-actions">
                <button id="editProfileBtn" class="btn-outline" style="font-size:0.72rem;padding:10px 18px;">Editar Perfil</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow" data-aos="fade-up">
            <div class="stat-card">
                <div class="stat-label">Encomendas</div>
                <div class="stat-number" id="statOrders">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Lojas Diferentes</div>
                <div class="stat-number" id="statStores">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Estado</div>
                <div class="stat-number" id="statStatus" style="font-size:1.1rem;padding-top:6px;">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tipo de Conta</div>
                <div class="stat-number" id="statRole" style="font-size:1.1rem;padding-top:6px;">—</div>
            </div>
        </div>

        <!-- Encomendas recentes -->
        <section class="card glass-card" data-aos="fade-up">
            <div class="card-header">
                <h2 class="card-title" style="font-size:1.3rem;">Encomendas Recentes</h2>
                <span id="ordersCount" class="badge"></span>
            </div>
            <div id="ordersList"></div>
        </section>

    </div>

    <!-- Modal Editar Perfil -->
    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="editProfileModal" class="modal glass-panel">
        <div class="modal-header">
            <h2 style="font-size:1.4rem;margin:0;">Editar Perfil</h2>
            <button class="modal-close" onclick="closeModal('editProfileModal')">&times;</button>
        </div>
        <form id="editProfileForm" style="display:flex;flex-direction:column;gap:14px;">
            <input type="text" id="editUsername" placeholder="Nome de utilizador" required>
            <div id="editError" class="form-error" style="display:none;color:#e74c3c;font-size:0.82rem;"></div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn-primary" style="flex:1;">GUARDAR</button>
                <button type="button" class="btn-outline" onclick="closeModal('editProfileModal')" style="flex:1;">CANCELAR</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="app.js"></script>
    <script src="client.js"></script>
</body>
</html>
