<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="nicedrop.png">
    <link rel="apple-touch-icon" href="nicedrop.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
</head>
<body>

    <nav class="topbar">
        <a href="index.html"><img src="nicedrop.png" class="brand-logo" alt="NiceDrop"></a>
        <div class="topbar-right" style="gap:16px;">
            <span id="userName" class="user-name">---</span>
            <a href="client.html" class="btn-primary">Meu Perfil</a>
            <button id="logoutBtn" class="btn-primary">Sair</button>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-user">
                <div id="userAvatar" class="user-avatar">U</div>
            </div>

            <div class="sidebar-section-label">As Minhas Lojas</div>
            <div id="sidebarStores" class="sidebar-stores"></div>

            <div class="sidebar-spacer"></div>
        </aside>

        <main class="main-area">

            <div id="emptyState" class="empty-state">
                <div class="empty-state-content">
                    <div class="empty-state-icon">🏪</div>
                    <p style="color:var(--ink-faint);letter-spacing:1px;font-size:0.85rem;">Sem loja associada</p>
                </div>
            </div>

            <div id="contentGrid" style="display:none; flex-direction:column; gap:20px;">

                <div id="mainTopbar" class="main-topbar" style="display:none;">
                    <div>
                        <h1 id="storeTitle" class="store-title">---</h1>
                        <div id="storeMeta" class="store-meta"></div>
                    </div>
                    <button id="addOperatorBtn" class="btn-primary">+ Adicionar Funcionário</button> 
                </div>

                <div id="statsRow" class="stats-row"></div>
                
                <div id="detailRow" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;"></div>
                <style>#detailRow > .detail-card:last-child { grid-column: 1 / -1; }</style>

                <div id="postsRow"></div>

            </div>

        </main>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <!-- Modal Adicionar Operador -->
    <div id="addOperatorModal" class="modal glass-panel">
        <div class="modal-header">
            <h2 style="font-size:1.4rem;margin:0;">Novo Funcionário</h2>
            <button class="modal-close" onclick="closeModal('addOperatorModal')">&times;</button>
        </div>
        <form id="addOperatorForm" style="display:flex;flex-direction:column;gap:14px;">
            <input type="email" id="addOperatorEmail" placeholder="Email do utilizador" required>
            <div id="addOperatorError" class="form-error" style="display:none;"></div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn-primary" style="flex:1;">ADICIONAR</button>
                <button type="button" class="btn-outline" onclick="closeModal('addOperatorModal')" style="flex:1;">CANCELAR</button>
            </div>
        </form>
    </div>

    <!-- Modal Post -->
    <div id="dashPostModal" class="modal glass-panel" style="max-width:520px;width:92vw;">
        <div class="modal-header">
            <h2 style="font-size:1.4rem;margin:0;" id="dashPostModalTitle">Novo Post</h2>
            <button class="modal-close" onclick="closeModal('dashPostModal')">&times;</button>
        </div>
        <form id="dashPostForm" style="display:flex;flex-direction:column;gap:14px;">
            <input type="hidden" id="dashPostId">
            <input type="text" id="dashPostTitle" placeholder="Título" required>
            <input type="text" id="dashPostAuthor" placeholder="Autor" readonly style="opacity:0.6;cursor:not-allowed;">
            <textarea id="dashPostContent" placeholder="Conteúdo..." rows="5" style="border-radius:0;resize:vertical;"></textarea>
            <div id="dashPostError" style="display:none;color:#e74c3c;font-size:0.82rem;"></div>
            <div style="display:flex;gap:10px;">
                <button type="submit" class="btn-primary" style="flex:1;">GUARDAR</button>
                <button type="button" class="btn-outline" onclick="closeModal('dashPostModal')" style="flex:1;">CANCELAR</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="app.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
