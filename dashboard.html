<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="dashboard-page">

    <!-- MODAL OVERLAY -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal('addOperatorModal')"></div>

    <!-- MODAL ADICIONAR FUNCIONÁRIO -->
    <div id="addOperatorModal" class="modal">
        <div class="modal-header">
            <h2>Adicionar Funcionário</h2>
            <button class="modal-close" onclick="closeModal('addOperatorModal')">×</button>
        </div>
        <div class="form-group">
            <label for="addOperatorEmail">Email do Funcionário</label>
            <input type="email" id="addOperatorEmail" placeholder="email@exemplo.com" autocomplete="off">
        </div>
        <div id="addOperatorError" class="form-error is-hidden"></div>
        <div class="form-actions">
            <button class="btn-secondary" onclick="closeModal('addOperatorModal')">Cancelar</button>
            <button class="btn-primary" id="addOperatorBtn">Adicionar</button>
        </div>
    </div>

    <!-- LAYOUT -->
    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="logo.png" alt="NiceDrop"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <span class="logo-text is-hidden">NICEDROP</span>
            </div>

            <div class="sidebar-user">
                <div id="userAvatar" class="user-avatar">U</div>
                <div id="userName" class="user-name">—</div>
                <div id="userRole" class="user-role">—</div>
            </div>

            <div class="sidebar-section-label">As Minhas Lojas</div>
            <div id="sidebarStores" class="sidebar-stores">
                <div class="spinner"></div>
            </div>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-logout">
                <button id="logoutBtn">⎋ &nbsp;Sair</button>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <div class="main-area">

            <!-- TOPBAR -->
            <div id="mainTopbar" class="main-topbar is-hidden">
                <div>
                    <h1 id="storeTitle" class="store-title">—</h1>
                    <div id="storeMeta" class="topbar-meta store-meta"></div>
                </div>
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state show">
                <div class="empty-state-content">
                    <div class="empty-state-icon">🏪</div>
                    <div>Seleccione uma loja na sidebar</div>
                </div>
            </div>

            <!-- CONTEÚDO -->
            <div id="mainContent" class="main-content is-hidden">

                <div class="kpi-bar" id="kpiBar"></div>

                <div class="dash-grid">

                    <!-- DRONES -->
                    <div class="section-block">
                        <div class="section-title">
                            Drones
                            <span id="droneCount">—</span>
                        </div>
                        <div id="dronesList"><div class="spinner"></div></div>
                    </div>

                    <!-- EQUIPA -->
                    <div class="section-block">
                        <div class="section-title">
                            Equipa
                            <button class="btn-add-employee" id="addEmployeeBtnTop">+ Funcionário</button>
                        </div>
                        <div id="teamList"><div class="spinner"></div></div>
                    </div>

                    <!-- ENCOMENDAS -->
                    <div class="section-block full-width">
                        <div class="section-title">
                            Encomendas Recentes
                            <span id="orderCount">—</span>
                        </div>
                        <div id="ordersList"><div class="spinner"></div></div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
    let supabaseClient = null;
    const state = { user:null, stores:[], drones:[], team:[], orders:[], currentStoreId:null };

    function waitForSupabase(cb) {
        if (window.supabase?.createClient) cb();
        else setTimeout(() => waitForSupabase(cb), 50);
    }

    async function init() {
        waitForSupabase(async () => {
            supabaseClient = window.supabaseConfig.init();
            const { data:{ session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href='/auth.html'; return; }

            const { data:profile } = await supabaseClient
                .from('profiles').select('id,username,role,store_id').eq('id',session.user.id).single();
            if (!profile) { window.location.href='/auth.html'; return; }

            const role = (profile.role||'').trim().toLowerCase();
            if (role==='client'||role==='operator') { alert('Sem acesso.'); window.location.href='/auth.html'; return; }
            if (role==='developer') { window.location.href='/admin.html'; return; }
            if (role!=='owner') { window.location.href='/auth.html'; return; }

            state.user = profile;
            document.getElementById('userAvatar').textContent = (profile.username||'U')[0].toUpperCase();
            document.getElementById('userName').textContent = profile.username||'—';
            document.getElementById('userRole').textContent = role.toUpperCase();

            await loadOwnerStores(profile);
            renderSidebar();
            bindEvents();
            if (state.stores.length>0) await selectStore(state.stores[0].id);
        });
    }

    async function loadOwnerStores(profile) {
        let ids = [];
        if (Array.isArray(profile.store_id)) ids = profile.store_id;
        else if (typeof profile.store_id==='number') ids = [profile.store_id];
        else if (typeof profile.store_id==='string') {
            try { const p=JSON.parse(profile.store_id); ids=Array.isArray(p)?p:[p]; } catch { ids=[]; }
        }
        if (!ids.length) { state.stores=[]; return; }
        const { data } = await supabaseClient.from('stores')
            .select('id,name,service,latitude,longitude,owner_id').in('id',ids);
        state.stores = data||[];
    }

    async function selectStore(storeId) {
        state.currentStoreId = storeId;
        showMain();
        renderTopbar();
        renderKPI();
        await Promise.all([loadDrones(storeId), loadTeam(storeId), loadOrders(storeId)]);
        renderKPI(); renderDrones(); renderTeam(); renderOrders(); renderSidebar();
    }

    async function loadDrones(storeId) {
        const { data } = await supabaseClient.from('drones')
            .select('id,name,capacity,status,servo_state,store_id').eq('store_id',storeId);
        state.drones = data||[];
    }

    async function loadTeam(storeId) {
        const { data } = await supabaseClient.from('profiles')
            .select('id,username,role,store_id').contains('store_id',JSON.stringify([storeId]));
        state.team = data||[];
    }

    async function loadOrders(storeId) {
        const { data } = await supabaseClient.from('orders')
            .select('id,created_at,price,status,address,drone_id,store_id,store')
            .eq('store_id',storeId).order('created_at',{ascending:false}).limit(20);
        state.orders = data||[];
    }

    function showMain() {
        const es = document.getElementById('emptyState');
        es.classList.remove('show'); es.style.display='none';
        document.getElementById('mainContent').style.display='block';
        document.getElementById('mainTopbar').style.display='flex';
    }

    function renderSidebar() {
        const el = document.getElementById('sidebarStores');
        if (!el) return;
        if (!state.stores.length) {
            el.innerHTML='<div style="padding:12px 20px;font-family:Sora,sans-serif;font-size:.75rem;color:#aaa;">Sem lojas associadas</div>';
            return;
        }
        el.innerHTML = state.stores.map(s=>`
            <div class="sidebar-store-item ${s.id===state.currentStoreId?'active':''}" data-store-id="${s.id}">
                <span class="sidebar-store-icon">${s.service?'🟢':'🔴'}</span>
                <span>${s.name}</span>
            </div>`).join('');
        el.querySelectorAll('.sidebar-store-item').forEach(item=>{
            item.addEventListener('click',()=>selectStore(Number(item.dataset.storeId)));
        });
    }

    function renderTopbar() {
        const store = state.stores.find(s=>s.id===state.currentStoreId);
        if (!store) return;
        document.getElementById('storeTitle').textContent = store.name;
        document.getElementById('storeMeta').innerHTML = `
            <span class="badge ${store.service?'badge-active':'badge-inactive'}">${store.service?'ATIVA':'INATIVA'}</span>
            ${store.latitude?`<span style="font-family:'Sora',sans-serif;font-size:.72rem;color:#aaa;">📍 ${Number(store.latitude).toFixed(4)}, ${Number(store.longitude).toFixed(4)}</span>`:''}
        `;
    }

    function renderKPI() {
        const total   = state.drones.length;
        const ativos  = state.drones.filter(d=>d.status==='active'||d.status==='shipping').length;
        const equipa  = state.team.length;
        const orders  = state.orders.length;
        const receita = state.orders.reduce((s,o)=>s+(parseFloat(o.price)||0),0);

        document.getElementById('kpiBar').innerHTML=`
            <div class="kpi-card">
                <div class="kpi-label">Total Drones</div>
                <div class="kpi-value">${total}</div>
                <div class="kpi-sub">${ativos} activos</div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-label">Drones Activos</div>
                <div class="kpi-value">${ativos}</div>
                <div class="kpi-sub">Em operação</div>
            </div>
            <div class="kpi-card blue">
                <div class="kpi-label">Equipa</div>
                <div class="kpi-value">${equipa}</div>
                <div class="kpi-sub">Funcionários</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Encomendas</div>
                <div class="kpi-value">${orders}</div>
                <div class="kpi-sub">Últimas 20</div>
            </div>
            <div class="kpi-card ${receita>0?'green':''}">
                <div class="kpi-label">Receita</div>
                <div class="kpi-value">${formatEuro(receita)}</div>
                <div class="kpi-sub">Total encomendas</div>
            </div>`;
    }

    function renderDrones() {
        document.getElementById('droneCount').textContent=`${state.drones.length} drone${state.drones.length!==1?'s':''}`;
        if (!state.drones.length) {
            document.getElementById('dronesList').innerHTML='<div class="no-data">Sem drones registados</div>'; return;
        }
        const sm={active:'badge-active',pending:'badge-pending',shipping:'badge-shipping',inactive:'badge-inactive'};
        document.getElementById('dronesList').innerHTML=`
            <table class="drone-table">
                <thead><tr>
                    <th>Nome</th><th>Estado</th><th>Capacidade</th><th>Servo</th><th>ID</th>
                </tr></thead>
                <tbody>${state.drones.map(d=>`
                    <tr>
                        <td class="drone-name-cell">✈️ ${d.name}</td>
                        <td><span class="badge ${sm[d.status]||'badge-pending'}">${(d.status||'pending').toUpperCase()}</span></td>
                        <td><span class="km-chip">${d.capacity??'—'} g</span></td>
                        <td><span class="badge ${d.servo_state?'badge-on':'badge-off'}">${d.servo_state?'ON':'OFF'}</span></td>
                        <td style="color:#bbb;font-size:.72rem;">#${d.id}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
    }

    function renderTeam() {
        if (!state.team.length) {
            document.getElementById('teamList').innerHTML='<div class="no-data">Sem funcionários</div>'; return;
        }
        const rm={owner:'badge-active',operator:'badge-pending',client:'badge-off',developer:'badge-shipping'};
        document.getElementById('teamList').innerHTML=`
            <table class="team-table">
                <thead><tr><th>Nome</th><th>Papel</th><th>Ações</th></tr></thead>
                <tbody>${state.team.map(m=>`
                    <tr>
                        <td><div class="member-cell">
                            <div class="member-av">${(m.username||'U')[0].toUpperCase()}</div>${m.username||'—'}
                        </div></td>
                        <td><span class="badge ${rm[m.role]||'badge-off'}">${(m.role||'—').toUpperCase()}</span></td>
                        <td>${m.role!=='owner'?`
                            <button class="btn-promote" onclick="promoteToOwner('${m.id}')">Owner</button>
                            <button class="btn-danger"  onclick="removeMember('${m.id}')">✕</button>
                        `:'<span style="color:#bbb;font-size:.72rem;">—</span>'}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
    }

    function renderOrders() {
        document.getElementById('orderCount').textContent=`${state.orders.length} encomenda${state.orders.length!==1?'s':''}`;
        if (!state.orders.length) {
            document.getElementById('ordersList').innerHTML='<div class="no-data">Sem encomendas registadas</div>'; return;
        }
        const sm={pending:'badge-pending',active:'badge-active',shipping:'badge-shipping',delivered:'badge-active',cancelled:'badge-inactive'};
        document.getElementById('ordersList').innerHTML=`
            <table class="drone-table">
                <thead><tr>
                    <th>ID</th><th>Data</th><th>Morada</th><th>Drone</th><th>Estado</th><th>Valor</th>
                </tr></thead>
                <tbody>${state.orders.map(o=>`
                    <tr>
                        <td style="color:#bbb;font-size:.72rem;">#${o.id}</td>
                        <td>${o.created_at?new Date(o.created_at).toLocaleDateString('pt-PT'):'—'}</td>
                        <td style="font-size:.78rem;color:#555;">${o.address||o.store||'—'}</td>
                        <td><span class="km-chip">#${o.drone_id||'—'}</span></td>
                        <td><span class="badge ${sm[o.status]||'badge-pending'}">${(o.status||'—').toUpperCase()}</span></td>
                        <td style="font-family:'BebasNeue',sans-serif;font-size:1rem;">${formatEuro(o.price)}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
    }

    async function promoteToOwner(memberId) {
        if (!confirm('Promover a Owner?')) return;
        // Buscar o perfil do membro para obter as lojas atuais
        const { data: member, error: fetchError } = await supabaseClient.from('profiles').select('store_id').eq('id', memberId).single();
        if (fetchError || !member) { alert('Erro ao buscar perfil: ' + (fetchError?.message || '')); return; }
        let ids = [];
        if (Array.isArray(member.store_id)) ids = member.store_id;
        else if (typeof member.store_id === 'number') ids = [member.store_id];
        else if (typeof member.store_id === 'string') {
            try { const p = JSON.parse(member.store_id); ids = Array.isArray(p) ? p : [p]; } catch { ids = []; }
        }
        // Adiciona a loja atual se não existir
        if (!ids.includes(state.currentStoreId)) ids.push(state.currentStoreId);
        const { error } = await supabaseClient.from('profiles').update({store_id: ids, role: 'owner'}).eq('id', memberId);
        if (error) { alert('Erro: '+error.message); return; }
        await loadTeam(state.currentStoreId); renderTeam();
    }

    async function removeMember(userId) {
        if (!confirm('Remover este membro?')) return;
        const member = state.team.find(m=>m.id===userId);
        if (!member) return;
        let ids = Array.isArray(member.store_id)?member.store_id:[];
        ids = ids.filter(id=>id!==state.currentStoreId);
        const { error } = await supabaseClient.from('profiles')
            .update({store_id:ids.length?ids:null, role:ids.length?member.role:'client'}).eq('id',userId);
        if (error) { alert('Erro: '+error.message); return; }
        await loadTeam(state.currentStoreId); renderTeam(); renderKPI();
    }

    function bindEvents() {
        document.getElementById('logoutBtn').addEventListener('click',async()=>{
            await supabaseClient.auth.signOut();
            localStorage.removeItem('nicedrop_user');
            window.location.href='/auth.html';
        });

        document.getElementById('addEmployeeBtnTop').addEventListener('click',()=>openModal('addOperatorModal'));

        document.getElementById('addOperatorBtn').addEventListener('click',async()=>{
            const emailInput = document.getElementById('addOperatorEmail');
            const errorDiv   = document.getElementById('addOperatorError');
            errorDiv.style.display='none'; errorDiv.textContent='';
            const email = emailInput.value.trim();
            if (!email) { errorDiv.textContent='Introduza o email.'; errorDiv.style.display='block'; return; }

            const { data:user, error:userErr } = await supabaseClient
                .from('users_with_email').select('id,store_id,role').eq('email',email).single();
            if (userErr||!user) { errorDiv.textContent='Utilizador não encontrado.'; errorDiv.style.display='block'; return; }

            let ids = Array.isArray(user.store_id)?user.store_id:[];
            if (!ids.includes(state.currentStoreId)) ids.push(state.currentStoreId);

            const { error } = await supabaseClient.from('profiles')
                .update({store_id:ids, role:'operator'}).eq('id',user.id);
            if (error) { errorDiv.textContent='Erro: '+error.message; errorDiv.style.display='block'; return; }

            closeModal('addOperatorModal'); emailInput.value='';
            await loadTeam(state.currentStoreId); renderTeam(); renderKPI();
        });
    }

    function openModal(id)  { const m=document.getElementById(id); if(m) m.classList.add('show'); document.getElementById('modalOverlay').classList.add('show'); }
    function closeModal(id) { const m=document.getElementById(id); if(m) m.classList.remove('show'); document.getElementById('modalOverlay').classList.remove('show'); }
    window.openModal=openModal; window.closeModal=closeModal;
    window.promoteToOwner=promoteToOwner; window.removeMember=removeMember;

    function formatEuro(value) {
        return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(value||0);
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
