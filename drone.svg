<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0D1B36"/>
    </radialGradient>
    <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rotor glow halos -->
  <circle cx="100" cy="100" r="60" fill="url(#rg1)"/>
  <circle cx="380" cy="100" r="60" fill="url(#rg1)"/>
  <circle cx="100" cy="380" r="60" fill="url(#rg1)"/>
  <circle cx="380" cy="380" r="60" fill="url(#rg1)"/>

  <!-- Arms -->
  <line x1="240" y1="240" x2="108" y2="108" stroke="#152944" stroke-width="18" stroke-linecap="round"/>
  <line x1="240" y1="240" x2="372" y2="108" stroke="#152944" stroke-width="18" stroke-linecap="round"/>
  <line x1="240" y1="240" x2="108" y2="372" stroke="#152944" stroke-width="18" stroke-linecap="round"/>
  <line x1="240" y1="240" x2="372" y2="372" stroke="#152944" stroke-width="18" stroke-linecap="round"/>
  <!-- Arm edge highlight -->
  <line x1="240" y1="240" x2="108" y2="108" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="240" y1="240" x2="372" y2="108" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="240" y1="240" x2="108" y2="372" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="240" y1="240" x2="372" y2="372" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Motor housings -->
  <circle cx="100" cy="100" r="24" fill="#0D1B36" stroke="#0EA5E9" stroke-width="2.5"/>
  <circle cx="380" cy="100" r="24" fill="#0D1B36" stroke="#0EA5E9" stroke-width="2.5"/>
  <circle cx="100" cy="380" r="24" fill="#0D1B36" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="380" cy="380" r="24" fill="#0D1B36" stroke="#38BDF8" stroke-width="2.5"/>

  <!-- Rotor blades TL -->
  <ellipse cx="100" cy="100" rx="58" ry="8" fill="#0EA5E9" opacity="0.55" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="58" ry="8" fill="#0EA5E9" opacity="0.55" transform="rotate(60 100 100)"/>
  <!-- Rotor blades TR -->
  <ellipse cx="380" cy="100" rx="58" ry="8" fill="#0EA5E9" opacity="0.55" transform="rotate(30 380 100)"/>
  <ellipse cx="380" cy="100" rx="58" ry="8" fill="#0EA5E9" opacity="0.55" transform="rotate(-60 380 100)"/>
  <!-- Rotor blades BL -->
  <ellipse cx="100" cy="380" rx="58" ry="8" fill="#38BDF8" opacity="0.55" transform="rotate(30 100 380)"/>
  <ellipse cx="100" cy="380" rx="58" ry="8" fill="#38BDF8" opacity="0.55" transform="rotate(-60 100 380)"/>
  <!-- Rotor blades BR -->
  <ellipse cx="380" cy="380" rx="58" ry="8" fill="#38BDF8" opacity="0.55" transform="rotate(-30 380 380)"/>
  <ellipse cx="380" cy="380" rx="58" ry="8" fill="#38BDF8" opacity="0.55" transform="rotate(60 380 380)"/>

  <!-- LED dots (glowing) -->
  <circle cx="100" cy="100" r="7" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="380" cy="100" r="7" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="100" cy="380" r="7" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="380" cy="380" r="7" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Central body -->
  <rect x="192" y="192" width="96" height="96" rx="20" fill="url(#bodyGrad)" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="205" y="205" width="70" height="70" rx="14" fill="none" stroke="#0EA5E9" stroke-width="0.7" opacity="0.3"/>
  <!-- N logo mark -->
  <text x="240" y="248" text-anchor="middle" dominant-baseline="middle"
        font-family="'BebasNeue', sans-serif" font-size="34" font-weight="700"
        fill="#0EA5E9" opacity="0.75">N</text>

  <!-- Payload string -->
  <line x1="225" y1="288" x2="222" y2="316" stroke="#0EA5E9" stroke-width="1.8" opacity="0.6"/>
  <line x1="255" y1="288" x2="258" y2="316" stroke="#0EA5E9" stroke-width="1.8" opacity="0.6"/>
  <!-- Payload box -->
  <rect x="210" y="316" width="60" height="44" rx="6" fill="#0D1B36" stroke="#0EA5E9" stroke-width="1.8"/>
  <line x1="210" y1="338" x2="270" y2="338" stroke="#0EA5E9" stroke-width="0.9" opacity="0.45"/>
  <line x1="240" y1="316" x2="240" y2="360" stroke="#0EA5E9" stroke-width="0.9" opacity="0.45"/>
</svg>
