<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Admin Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            background: url('sky.png') no-repeat center center fixed !important;
            background-size: cover !important;
            margin: 0;
            color: #1a3a5c;
            font-family: 'DM Sans', sans-serif;
        }

        .admin-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            font-family: 'Bebas Neue';
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding: 15px;
            border-bottom: 2px solid rgba(26, 58, 92, 0.1);
            color: #1a3a5c;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 1;
        }

        .minimal-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            padding: 12px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .grid-forms {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            margin-top: 50px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 30px;
        }

        @media (max-width: 900px) {
            .grid-forms { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav style="padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
        <img src="nicedrop.png" style="height: 35px;" alt="NiceDrop">
        <div style="text-align: right;">
            <span id="adminUsername" style="display: block; font-weight: 700;">---</span>
            <button id="logoutBtn" class="btn-primary" style="padding: 5px 20px; font-size: 0.7rem; margin-top: 5px;">SAIR</button>
        </div>
    </nav>

    <div class="admin-container">
        <h1 style="font-family: 'Bebas Neue'; font-size: 3.5rem; margin-bottom: 10px;">Network Users</h1>
        <input type="text" id="searchInput" class="minimal-input" placeholder="Filtrar utilizadores..." style="max-width: 300px; margin-bottom: 20px;">

        <div class="table-container" data-aos="fade-up">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Papel</th>
                        <th>Lojas Associadas</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    </tbody>
            </table>
        </div>

        <div class="grid-forms">
            <div class="glass-card" data-aos="fade-right">
                <h2 style="font-family: 'Bebas Neue'; margin-top: 0;">Nova Loja (Node)</h2>
                <div id="map"></div>
                <p style="font-size: 0.7rem; opacity: 0.6; margin-top: 10px;">Clique no mapa para marcar a localização exata.</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 30px;">
                <div class="glass-card" data-aos="fade-left">
                    <h3 style="font-family: 'Bebas Neue'; margin-top: 0;">Detalhes da Loja</h3>
                    <input type="email" id="ownerEmail" placeholder="Email do Owner" class="minimal-input" style="margin-bottom: 15px;">
                    <input type="text" id="storeName" placeholder="Nome da Loja" class="minimal-input" style="margin-bottom: 15px;">
                    <input type="hidden" id="storeLat">
                    <input type="hidden" id="storeLng">
                    <button id="createStoreBtn" class="btn-primary" style="width: 100%; padding: 15px;">CRIAR LOJA</button>
                </div>

                <div class="glass-card" data-aos="fade-left" data-aos-delay="200">
                    <h3 style="font-family: 'Bebas Neue'; margin-top: 0;">Adicionar Drone</h3>
                    <select id="addDroneStore" class="minimal-input" style="margin-bottom: 15px;"></select>
                    <input type="text" id="addDroneName" placeholder="Nome/ID do Drone" class="minimal-input" style="margin-bottom: 15px;">
                    <button id="addDroneBtn" class="btn-primary" style="width: 100%; padding: 15px;">ADICIONAR HARDWARE</button>
                </div>
            </div>
        </div>

        <section style="margin-top: 50px;">
            <h2 style="font-family: 'Bebas Neue';">Lojas Ativas</h2>
            <div id="storesBody" class="stores-grid"></div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="admin.js" defer></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 800 });
            window.addEventListener('resize', () => {
                if(window.mapInstance) window.mapInstance.invalidateSize();
            });
        });
    </script>
</body>
</html>
