<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Administração</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="admin-layout">
    <div class="topbar">
        <img src="nicedrop.png" class="brand-logo" alt="NiceDrop logo">
        <div class="topbar-user">
            <div class="user-info">
                <span id="adminUsername" class="user-name"></span>
                <span id="adminRole" class="user-role"></span>
            </div>
            <button id="logoutBtn">← Sair</button>
        </div>
    </div>
    <div class="page-title"><h1>PAINEL DE ADMINISTRAÇÃO</h1></div>
    <main class="main">
        <div class="stats-row" id="userTypeSummary"></div>
        <section class="card glass-card" data-aos="fade-up">
            <div class="card-header">
                <h2 class="card-title">Utilizadores</h2>
                <div class="toolbar">
                    <input type="text" id="searchInput" placeholder="Procurar por nome ou email">
                    <button id="refreshBtn" class="btn-primary">Atualizar</button>
                </div>
            </div>
            <p id="message" class="message"></p>
            <div class="table-vertical-scroll">
                <table class="glass-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Papel</th>
                            <th>Loja</th>
                            <th>Alterar Role</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </section>
        <section class="card glass-card" id="storesSection" data-aos="fade-up">
            <div class="card-header">
                <h2 class="card-title">Todas as Lojas</h2>
            </div>
            <div class="stores-grid" id="storesBody"></div>
        </section>
        <section class="card glass-card" id="createStoreSection" data-aos="fade-up">
            <div class="card-header">
                <h2 class="card-title">Criar Loja</h2>
            </div>
            <div class="form-row">
                <input type="email" id="ownerEmail" placeholder="Email do owner">
                <input type="text"  id="storeName"  placeholder="Nome da loja">
                <input type="hidden" id="storeLat">
                <input type="hidden" id="storeLng">
                <button id="createStoreBtn" class="btn-primary">Criar Loja</button>
            </div>
            <div id="map"></div>
        </section>
        <section class="card glass-card" id="dronesSection" data-aos="fade-up">
            <div class="card-header">
                <h2 class="card-title">Adicionar Drone</h2>
            </div>
            <div class="form-row">
                <select id="addDroneStore"></select>
                <input type="text" id="addDroneName" placeholder="Nome do drone">
                <button id="addDroneBtn" class="btn-primary">Adicionar Drone</button>
            </div>
        </section>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="/app.js"></script>
<script src="/admin.js"></script>
</body>
</html>
