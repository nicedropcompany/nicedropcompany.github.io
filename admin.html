<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NiceDrop | Administração</title>
    <link rel="stylesheet" href="/admin.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="admin-layout">

    <!-- BOTÃO SAIR -->
    <div class="logout-top-right">
        <button id="logoutBtn" class="logout-btn">← Sair</button>
    </div>

    <!-- MAIN -->
    <main class="main center-page">
        <!-- TOP BAR -->
        <div class="topbar center-bar">
            <h1>Painel de Administração</h1>
        </div>
        <!-- STATS -->
        <div class="stats-row" id="userTypeSummary"></div>
        <!-- USERS -->
        <section class="card">
            <div class="card-header">
                <h2>Utilizadores</h2>
                <div class="toolbar">
                    <input type="text" id="searchInput" placeholder="Procurar por nome ou email">
                    <button id="refreshBtn" class="btn-primary">Atualizar</button>
                </div>
            </div>
            <p id="message" class="message"></p>
            <table class="table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Papel</th>
                        <th>Loja</th>
                        <th>Alterar Role</th>
                    </tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </section>

        <!-- STORES -->
        <section class="card" id="storesSection">
            <div class="card-header">
                <h2>Todas as Lojas</h2>
            </div>
            <div class="stores-grid" id="storesBody"></div>
        </section>

        <!-- CRIAR LOJA -->
        <section class="card" id="createStoreSection">
            <div class="card-header">
                <h2>Criar Loja</h2>
            </div>
            <div class="form-row">
                <input type="email" id="ownerEmail" placeholder="Email do owner">
                <input type="text" id="storeName" placeholder="Nome da loja">
                <input type="text" id="storeCity" placeholder="Cidade">
                <input type="hidden" id="storeLat">
                <input type="hidden" id="storeLng">
                <button id="createStoreBtn" class="btn-primary">Criar Loja</button>
            </div>
            <div id="map" style="height:260px;margin-top:16px;border-radius:12px;overflow:hidden;"></div>
        </section>

        <!-- ADICIONAR DRONE -->
        <section class="card" id="dronesSection">
            <div class="card-header">
                <h2>Adicionar Drone</h2>
            </div>
            <div class="form-row">
                <select id="addDroneStore"></select>
                <input type="text" id="addDroneName" placeholder="Nome do drone">
                <button id="addDroneBtn" class="btn-primary">Adicionar Drone</button>
            </div>
        </section>

    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/admin.js"></script>
</body>
</html>
