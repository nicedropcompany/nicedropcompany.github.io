    <!DOCTYPE html>
    <html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NiceDrop | Confirmação de Email</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="app-page">
        <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="width:min(100%,520px);background:white;padding:36px;box-shadow:-5px 5px 0 rgba(0,0,0,0.30);border:1px solid rgba(0,0,0,0.08);">
                <h2>Confirmação de Email</h2>
                <p id="message" class="hero-text">A verificar o seu link...</p>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="/supabase-config.js"></script>
        <script>
        async function checkEmailConfirmation() {
            const msg = document.getElementById('message');
            const hash = window.location.hash;
            const search = window.location.search;
            const params = new URLSearchParams(search);
            const hashParams = new URLSearchParams(hash.replace(/^#/, ''));

            // Helper para esperar supabase
            function waitForSupabase(cb) {
                if (window.supabaseConfig && window.supabaseConfig.getClient) cb();
                else setTimeout(() => waitForSupabase(cb), 50);
            }

            // Lógica principal
            waitForSupabase(async () => {
                await window.supabaseConfig.init();
                const supabase = window.supabaseConfig.getClient();
                if (!supabase) {
                    msg.textContent = 'Erro ao inicializar Supabase.';
                    msg.style.color = 'red';
                    return;
                }

                // 1. PKCE flow: ?code=...
                if (params.has('code')) {
                    try {
                        const { error } = await supabase.auth.exchangeCodeForSession(params.get('code'));
                        if (error) throw error;
                        msg.textContent = 'Email confirmado com sucesso! A redirecionar...';
                        msg.style.color = 'green';
                        setTimeout(() => { window.location.href = '/auth.html'; }, 2000);
                        return;
                    } catch (e) {
                        msg.textContent = 'Link inválido ou expirado.';
                        msg.style.color = 'red';
                        return;
                    }
                }

                // 2. Hash ou query com type=signup/email_change
                const type = hashParams.get('type') || params.get('type');
                if (type === 'signup' || type === 'email_change') {
                    // Se vier com access_token/refresh_token no hash
                    if (hashParams.get('access_token') && hashParams.get('refresh_token')) {
                        // Supabase já faz o setSession automaticamente, só precisa verificar sessão
                        try {
                            const { data, error } = await supabase.auth.getSession();
                            if (error || !data.session) throw error;
                            msg.textContent = 'Email confirmado com sucesso! A redirecionar...';
                            msg.style.color = 'green';
                            setTimeout(() => { window.location.href = '/auth.html'; }, 2000);
                            return;
                        } catch (e) {
                            msg.textContent = 'Link inválido ou expirado.';
                            msg.style.color = 'red';
                            return;
                        }
                    }
                    // Caso especial: token_hash na query (ex: ?token_hash=...&type=signup)
                    if (params.get('token_hash')) {
                        // Supabase trata isto internamente, só precisa verificar sessão
                        try {
                            const { data, error } = await supabase.auth.getSession();
                            if (error || !data.session) throw error;
                            msg.textContent = 'Email confirmado com sucesso! A redirecionar...';
                            msg.style.color = 'green';
                            setTimeout(() => { window.location.href = '/auth.html'; }, 2000);
                            return;
                        } catch (e) {
                            msg.textContent = 'Link inválido ou expirado.';
                            msg.style.color = 'red';
                            return;
                        }
                    }
                }

                // Se não encontrou nenhum dos fluxos válidos
                msg.textContent = 'Link inválido ou expirado.';
                msg.style.color = 'red';
            });
        }
        checkEmailConfirmation();
        </script>
    </body>
    </html>
