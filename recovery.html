    <!DOCTYPE html>
    <html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NiceDrop | Confirmação de Email</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="app-page">
        <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
            <div style="width:min(100%,520px);background:white;padding:36px;box-shadow:-5px 5px 0 rgba(0,0,0,0.30);border:1px solid rgba(0,0,0,0.08);">
                <h2>Confirmação de Email</h2>
                <p id="message" class="hero-text">A verificar o seu link...</p>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="/supabase-config.js"></script>
        <script>
        async function checkEmailConfirmation() {
            const msg = document.getElementById('message');
            // Verifica se existe token na hash ou query
            const hash = window.location.hash;
            const search = window.location.search;
            const hasToken = hash.includes('access_token') || search.includes('token_hash');
            if (!hasToken) {
                msg.textContent = 'Link inválido ou expirado.';
                msg.style.color = 'red';
                return;
            }
            // Espera supabase carregar
            function waitForSupabase(cb) {
                if (window.supabaseConfig && window.supabaseConfig.getClient) cb();
                else setTimeout(() => waitForSupabase(cb), 50);
            }
            waitForSupabase(async () => {
                await window.supabaseConfig.init();
                const supabase = window.supabaseConfig.getClient();
                if (!supabase) {
                    msg.textContent = 'Erro ao inicializar Supabase.';
                    msg.style.color = 'red';
                    return;
                }
                try {
                    const { data, error } = await supabase.auth.getSession();
                    if (error || !data.session) {
                        msg.textContent = 'Link inválido ou expirado.';
                        msg.style.color = 'red';
                        return;
                    }
                    msg.textContent = 'Email confirmado! A redirecionar...';
                    msg.style.color = 'green';
                    setTimeout(() => { window.location.href = '/auth.html'; }, 2000);
                } catch (e) {
                    msg.textContent = 'Erro ao confirmar email.';
                    msg.style.color = 'red';
                }
            });
        }
        checkEmailConfirmation();
        </script>
    </body>
    </html>
