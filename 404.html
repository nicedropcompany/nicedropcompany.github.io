<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiceDrop | 404 — Entrega Perdida</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="nicedrop.png">
<link rel="apple-touch-icon" href="nicedrop.png">
<link rel="stylesheet" href="style.css">
<style>
.page-404-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
  z-index: 1;
}

.card-404 {
  text-align: center;
  padding: 52px 44px 44px;
  max-width: 500px;
  width: 100%;
}

.drone-404 {
  width: 150px;
  opacity: 0.55;
  animation: float404 5s ease-in-out infinite;
  margin: 0 auto 28px;
}

@keyframes float404 {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%       { transform: translateY(-20px) rotate(2deg); }
}

.error-tag-404 {
  display: inline-block;
  font-size: 0.65rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #000;
  background: rgba(0, 0, 0, 0.07);
  border: 1px solid rgba(0, 0, 0, 0.18);
  padding: 6px 14px;
  margin-bottom: 18px;
}

.title-404 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(90px, 20vw, 180px);
  line-height: 0.88;
  letter-spacing: -4px;
  color: #000;
  margin-bottom: 12px;
}

.subtitle-404 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.3rem, 4vw, 2.2rem);
  letter-spacing: 2px;
  color: rgba(0, 0, 0, 0.65);
  margin-bottom: 20px;
  text-transform: uppercase;
}

.desc-404 {
  font-size: 0.95rem;
  line-height: 1.7;
  color: rgba(0, 0, 0, 0.55);
  max-width: 380px;
  margin: 0 auto 32px;
}

.scanline-404 {
  width: 220px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.3), transparent);
  margin: 0 auto 32px;
  animation: scanPulse 2.5s ease-in-out infinite;
}

@keyframes scanPulse {
  0%, 100% { opacity: 0.3; transform: scaleX(0.4); }
  50%       { opacity: 1;   transform: scaleX(1); }
}

.coords-404 {
  font-size: 0.6rem;
  letter-spacing: 2px;
  color: rgba(0, 0, 0, 0.35);
  margin-top: 28px;
}
</style>
</head>
<body>
<main>
  <div class="page-404-wrap">
    <div class="card-404 glass-card">

      <span class="error-tag-404">ERRO — 404</span>

      <h1 class="title-404">404</h1>
      <h2 class="subtitle-404">ENTREGA PERDIDA NO AR</h2>

      <p class="desc-404">
        Este pacote saiu do radar. A página que procuras não foi encontrada — o drone voltou sem entregar.
      </p>

      <div class="scanline-404"></div>

      <a href="index.html" class="btn-home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        VOLTAR AO INÍCIO
      </a>

      <p class="coords-404">38.7167° N — 9.1333° W — ALT: ???m</p>

    </div>
  </div>
</main>
</body>
</html>
